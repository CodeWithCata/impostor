<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Intrus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;--fog:#F4F4F6;--line:#E4E4E9;
  --ink:#111114;--grey:#5C5C66;--red:#D8002B;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s6:48px;--s8:64px;
  --r1:16px;--r2:24px;--r3:32px;--pill:999px;
  --fs-s:14px;--fs-m:16px;--fs-l:20px;--fs-xl:28px;--fs-xxl:40px;--fs-hero:56px;
  --ease:.2s ease;
  color-scheme:light;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper);-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;color:var(--ink);font:400 var(--fs-m)/1.5 "Plus Jakarta Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3,p,ul{margin:0;padding:0;list-style:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{flex:none;display:block}
.h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:var(--fs-l);font-weight:800;letter-spacing:-.01em}
.muted{color:var(--grey)}.small{font-size:var(--fs-s)}

/* hero */

/* dock */
.dock{position:sticky;bottom:0;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s3) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),var(--paper) 40%)}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s1);min-height:56px;padding:0 var(--s4);border-radius:var(--pill);background:var(--fog);font-weight:800;font-size:var(--fs-m);transition:transform var(--ease),background var(--ease),opacity var(--ease)}
.btn.go{background:var(--ink);color:#fff;width:100%;font-size:var(--fs-l)}
.btn.full{width:100%}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--line)}.btn.go:hover{background:#2A2A30}}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;pointer-events:none}
.link{min-height:48px;font-weight:600;color:var(--grey);padding:0 var(--s2)}
.note{min-height:24px;text-align:center}
.round{flex:none;width:48px;height:48px;border-radius:var(--pill);background:var(--fog);display:grid;place-items:center;transition:transform var(--ease),background var(--ease)}
@media (hover:hover) and (pointer:fine){.round:hover{background:var(--line)}}.round:active{transform:scale(.9)}

/* players */
.pick{border-radius:var(--pill);transition:transform var(--ease)}
.pick:active{transform:scale(.9) rotate(-8deg)}
.field{flex:1;min-width:0;height:48px;padding:0;border:0;background:transparent;font-weight:600;font-size:var(--fs-l)}
.field::placeholder{color:var(--grey);font-weight:400}
.field:focus{outline:none}
.add{margin-top:var(--s2)}

/* rows */
.stepper{display:flex;align-items:center;gap:var(--s2)}
.num{min-width:24px;text-align:center;font-size:var(--fs-l);font-weight:800}
.switch{flex:none;width:56px;height:32px;border-radius:var(--pill);background:var(--line);position:relative;transition:background var(--ease)}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:var(--pill);background:#fff;transition:transform var(--ease)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--fog);border-radius:var(--pill)}
.seg button,.chip{min-height:48px;border-radius:var(--pill);font-weight:600;transition:background var(--ease),color var(--ease),transform var(--ease)}
.seg button:active,.chip:active{transform:scale(.95)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{padding:0 var(--s2);background:var(--fog)}
.custom{height:56px;padding:0 var(--s2);border-radius:var(--r1);background:var(--fog);font-size:var(--fs-m);font-weight:600;width:100%}

/* sheet */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(17,17,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:480px;max-height:85dvh;overflow:auto;background:var(--paper);border-radius:var(--r3) var(--r3) 0 0;padding:var(--s2) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--s3);animation:rise .25s ease}
.grab{width:40px;height:4px;border-radius:var(--pill);background:var(--line);margin:0 auto}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* category tiles + selection effects */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1)}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s2) var(--s1);border-radius:var(--r2);background:var(--fog);font-weight:600;transition:background var(--ease),color var(--ease),transform var(--ease)}
.cat:active{transform:scale(.94)}
.cat[aria-pressed="true"]{background:var(--ink);color:#fff}
.cic{width:48px;height:48px;border-radius:var(--pill);background:#fff;color:var(--ink);display:grid;place-items:center}
.cic .ic{width:28px;height:28px}
.tick{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:var(--pill);background:#fff;color:var(--ink);display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.tick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tick path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .1s ease}
.cat[aria-pressed="true"] .tick{transform:scale(1)}
.cat[aria-pressed="true"] .tick path{stroke-dashoffset:0}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.pop .cic{animation:wiggle .45s ease}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:var(--pill);background:#fff;pointer-events:none;animation:spark .55s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.stk{display:flex}
.stk span{width:32px;height:32px;margin-left:-8px;border-radius:var(--pill);background:var(--ink);color:#fff;border:2px solid var(--paper);display:grid;place-items:center}
.stk span:first-child{margin-left:0}
.stk .ic{width:16px;height:16px}
.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.4)}}
.round:disabled{opacity:.3;pointer-events:none}
.suspect[aria-pressed="true"] .av{animation:hop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-6deg)}100%{transform:translateY(0)}}
.suspect[aria-pressed="true"] .lens{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}

/* game screens */
.screen{flex:1;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s2) var(--s3) 0}
.center{text-align:center;align-items:center}
.grow{flex:1}
.bar{display:flex;align-items:center;justify-content:space-between}
.bar .sp{width:48px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:var(--pill);background:var(--line)}
.steps i.on{background:var(--ink)}
.who{display:flex;align-items:center;gap:var(--s2)}
.cardwrap{flex:1;display:grid;place-items:center;padding-bottom:var(--s2)}
.card{position:relative;width:min(100%,288px);aspect-ratio:3/4;border-radius:var(--r3);background:var(--ink);display:grid;place-items:center;text-align:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform var(--ease)}
.card:active{transform:scale(.98)}
.card .back{position:absolute;inset:0;width:100%;height:100%}
.card.open{background:var(--fog)}
.card.open.bad{background:var(--red);color:#fff}
.card.open .back{display:none}
.face{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s3)}
.secret{font-size:var(--fs-xxl);font-weight:800;letter-spacing:-.03em;line-height:1.05;overflow-wrap:anywhere}
.stamp{display:inline-block;font-size:var(--fs-xxl);font-weight:800;border:4px solid currentColor;border-radius:var(--r1);padding:0 var(--s2);transform:rotate(-6deg);animation:slam .3s cubic-bezier(.2,1.4,.4,1) both}
.stamp.red{color:var(--red)}
@keyframes slam{from{transform:scale(2.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.hintline{font-weight:600}
.ringbox{position:relative;width:208px;height:208px;display:grid;place-items:center}
.ringbox svg.r{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer{font-size:var(--fs-hero);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--red)}
.starter{display:inline-flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s2) var(--s1) var(--s1);border-radius:var(--pill);background:var(--fog);font-weight:600}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.suspect{position:relative;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s3) var(--s2);border-radius:var(--r2);background:var(--fog);font-weight:600;transition:transform var(--ease),background var(--ease),color var(--ease)}
.suspect:active{transform:scale(.96)}
.suspect[aria-pressed="true"]{background:var(--red);color:#fff}
.suspect .lens{position:absolute;top:var(--s1);right:var(--s1);width:32px;height:32px;border-radius:var(--pill);background:#fff;color:var(--red);display:none;place-items:center}
.suspect[aria-pressed="true"] .lens{display:grid}
.stage{position:relative;display:flex;gap:var(--s3);justify-content:center;padding:var(--s4) var(--s3) var(--s1)}
.stage .cone{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.stage>div{position:relative;z-index:1}
.verdict{font-size:var(--fs-xl);font-weight:800}
.wordtag{font-size:var(--fs-xxl);font-weight:800;letter-spacing:-.03em}
.outcome{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);width:100%;min-height:64px;padding:var(--s1) var(--s3);border-radius:var(--r2);background:var(--fog);font-weight:600;text-align:left;transition:transform var(--ease),background var(--ease)}
@media (hover:hover) and (pointer:fine){.outcome:hover{background:var(--line)}}.outcome:active{transform:scale(.98)}
.outcome.rec{background:var(--ink);color:#fff}
.outcome.rec .pts{color:#fff}
.pts{flex:none;font-size:var(--fs-s);font-weight:800;color:var(--grey)}
.score{display:flex;align-items:center;gap:var(--s2);min-height:72px;border-bottom:1px solid var(--line)}
.score .name{flex:1;font-weight:600;font-size:var(--fs-l)}
.score .tot{font-size:var(--fs-xl);font-weight:800}
.score.top .tot{color:var(--red)}
.rank{width:24px;font-weight:800;color:var(--grey);text-align:center}
.trophy{width:96px;height:auto}
@media (prefers-reduced-motion:reduce){*,*::before{transition-duration:.01s!important;animation-duration:.01s!important}}

/* v6 home */
body.home{background:var(--fog)}
.home .dock{background:linear-gradient(rgba(244,244,246,0),var(--fog) 40%)}
.hero2{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:264px;margin:var(--s2) var(--s2) 0;padding:var(--s3);background:var(--red);color:#fff;border-radius:var(--r3);overflow:hidden}
.hero2 .icons{position:absolute;top:var(--s2);left:var(--s2);right:var(--s2);display:flex;justify-content:space-between;z-index:2}
.hbtn{width:48px;height:48px;border-radius:var(--pill);background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;transition:background var(--ease),transform var(--ease)}
@media (hover:hover) and (pointer:fine){.hbtn:hover{background:rgba(255,255,255,.32)}}.hbtn:active{transform:scale(.92)}
.hero2>svg{position:absolute;right:-8px;bottom:0;width:164px;height:auto}
.ht{position:relative;z-index:1}
.logo{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:88px;line-height:.9;letter-spacing:.01em}
.tag{font-weight:600;margin-top:var(--s1)}
.page2{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s4) var(--s2) var(--s6)}
.eyebrow{display:flex;align-items:center;gap:var(--s1);margin:0 var(--s1) var(--s1);font-size:var(--fs-s);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.eyebrow .ic{width:20px;height:20px}
.eyebrow span{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.panel.pad{padding:var(--s2)}
.cr{display:flex;align-items:center;gap:var(--s2);padding:var(--s2);min-height:72px}
.cr+.cr{border-top:1px solid var(--line)}
.cr.col{flex-wrap:wrap}.cr.col .seg{flex-basis:100%}
.ri{flex:none;width:40px;height:40px;border-radius:var(--pill);background:var(--fog);display:grid;place-items:center}
.rt{flex:1;min-width:0}
.rname{font-weight:800}
.rdesc{font-size:var(--fs-s);color:var(--grey);line-height:1.35}
.addrow{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:72px;padding:0 var(--s2);border-top:1px solid var(--line);font-weight:800;text-align:left;transition:background var(--ease)}
@media (hover:hover) and (pointer:fine){.addrow:hover{background:var(--fog)}}
.plus{width:48px;height:48px;border-radius:var(--pill);border:2px dashed var(--line);display:grid;place-items:center;color:var(--grey)}
.cat.wide{grid-column:1/-1;flex-direction:row;justify-content:center;padding:var(--s1) var(--s2)}
.cat.wide .cic{width:40px;height:40px}
#cw{margin-top:var(--s2)}#cw[hidden]{display:none}
.steps2{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s2)}
.steps2 li{display:flex;gap:var(--s2)}
.no{flex:none;width:32px;height:32px;border-radius:var(--pill);background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}

/* v6 fixes */
.screen>.dock{align-self:stretch;margin:0 calc(var(--s3) * -1)}
.stage{flex-wrap:wrap;justify-content:center;gap:var(--s2) var(--s3);padding-left:var(--s2);padding-right:var(--s2)}
.hero2{min-height:clamp(224px,64vw,264px)}
.hero2>svg{width:clamp(120px,40vw,164px)}
.ht{max-width:62%}
.logo{font-family:Anton,"Arial Narrow",Impact,sans-serif;font-size:clamp(48px,15vw,80px);white-space:nowrap}
.tag{max-width:12em}

/* small-screen robustness */
.cats{grid-template-columns:repeat(3,minmax(0,1fr))}
.cat{min-width:0;font-size:var(--fs-s)}
.seg button{white-space:nowrap;font-size:var(--fs-s);padding:0 4px}
.stepper{gap:var(--s1)}
.stepper .round{width:40px;height:40px}
.num{min-width:24px}
.rname,.rdesc{overflow-wrap:anywhere}
@media (min-width:400px){.cat{font-size:var(--fs-m)}}
@media (max-width:340px){.ri{display:none}.cic{width:40px;height:40px}.cic .ic{width:24px;height:24px}}

/* native feel, summary cards, a11y */
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.round,.stepper .round{width:48px;height:48px}
.switch::before{content:"";position:absolute;inset:-8px -4px}
.logo span{display:block;font-size:.6em;letter-spacing:.02em}
.sum{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:80px;padding:var(--s2);background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);text-align:left;transition:transform var(--ease)}
.sum:active{transform:scale(.98)}
.sum .rt{display:flex;flex-direction:column;gap:var(--s1)}
.sv{display:flex;align-items:center;gap:var(--s1);font-weight:800;font-size:var(--fs-l)}
.sum .stk span{width:32px;height:32px}
.avs{display:flex}.avs .av{margin-left:-8px;border-radius:var(--pill);background:var(--paper)}.avs .av:first-child{margin-left:0}
.acts{display:flex;gap:var(--s1)}.acts .btn{flex:1}.acts .btn.go{width:auto;font-size:var(--fs-m)}
.sheet:focus{outline:none}
.still,.still .sheet{animation:none}
.sheet{animation:rise .28s cubic-bezier(.2,1.2,.4,1)}
.suspect[aria-pressed="true"]{background:var(--ink)}.suspect .lens{color:var(--ink)}
.timer.low{color:var(--ink);animation:beat 1s infinite}@keyframes beat{50%{transform:scale(1.06)}}
.score.top .tot{color:var(--ink)}
.screen{animation:slide .22s ease}@keyframes slide{from{opacity:0;transform:translateY(16px)}}
@media (max-height:680px){.outcome{min-height:48px}.stage .av{width:64px;height:64px}}
#app{overflow-x:clip}
.sv{flex-wrap:wrap}
.logo{font-size:clamp(40px,13vw,72px)}
.hero2>svg{width:clamp(136px,44vw,180px)}
.sum .ri{width:48px;height:48px;background:none;color:var(--ink)}
.sum .ri .ic{width:40px;height:40px;stroke-width:1.75}
.ri.bare{background:none}
@media (max-width:340px){.sum .ri{display:grid;width:40px;height:40px}}
.sum .ri{width:56px;height:56px}
.sum:first-child .ri .ic{width:56px;height:56px}
@media (max-width:340px){.sum:first-child .ri .ic{width:48px;height:48px}}
.sum .ri{width:48px;height:48px}
.sum:first-child .ri .ic{width:44px;height:44px}
@media (max-width:340px){.sum:first-child .ri .ic{width:40px;height:40px}}
.sum .ri{width:40px;height:48px}
.sum:first-child .ri .ic{width:40px;height:48px}
.sum .rt{gap:var(--s1)}
.sum .rname{font-size:var(--fs-l)}
.sv{font-size:var(--fs-m);font-weight:600;color:var(--grey)}
.sum>.ic{color:var(--grey)}
@media (max-width:340px){.sum:first-child .ri .ic{width:36px;height:42px}.sum .ri{width:36px}}

/* soft gradients and background */
html{background:var(--fog)}
body{background:radial-gradient(110% 50% at 50% 0,#fff 0,rgba(255,255,255,0) 70%),linear-gradient(180deg,#fff 0,var(--fog) 100%)}
body.home{background:radial-gradient(90% 40% at 90% 0,rgba(216,0,43,.08),rgba(216,0,43,0) 70%),radial-gradient(80% 40% at 0 100%,rgba(17,17,20,.06),rgba(17,17,20,0) 70%),linear-gradient(180deg,#FAFAFB 0,var(--fog) 100%)}
.dock,.home .dock{background:linear-gradient(rgba(244,244,246,0),var(--fog) 40%)}
.hero2{background:radial-gradient(90% 70% at 88% 8%,#F0204F 0,rgba(240,32,79,0) 65%),linear-gradient(160deg,#E3052F 0,#B80024 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 16px 32px -16px rgba(216,0,43,.5)}
.btn.go{background:linear-gradient(180deg,#2B2B31 0,var(--ink) 100%);box-shadow:0 8px 24px -8px rgba(17,17,20,.5)}
.sum,.panel{background:linear-gradient(180deg,#fff 0,#FAFAFB 100%);box-shadow:0 1px 2px rgba(17,17,20,.04),0 12px 24px -16px rgba(17,17,20,.2)}
.sheet{background:linear-gradient(180deg,#fff 0,#FAFAFB 100%)}
.scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{background:linear-gradient(160deg,#2B2B31 0,var(--ink) 70%)}
.card.open{background:linear-gradient(180deg,#fff 0,var(--fog) 100%)}
.card.open.bad{background:linear-gradient(160deg,#E3052F 0,#B80024 100%)}
.suspect,.cat,.outcome{background-image:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.suspect[aria-pressed="true"],.cat[aria-pressed="true"],.outcome.rec{background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0))}

.pl .field::placeholder{color:#9A9AA6;font-weight:600}
.pen{flex:none;display:grid;place-items:center;color:#B4B4BF;transition:color .2s}
.pen .ic{width:20px;height:20px}
.pl .cr:focus-within .pen{color:var(--ink)}
.pl .cr .round{width:38px;height:38px}
.pl .addrow{min-height:72px;padding:0 16px 0 10px;gap:14px;font-size:17px}
.pl .addrow .plus{width:52px;height:52px}
.pcap{text-align:center;margin-top:calc(var(--s1) * -1)}
/* v24 avatars without background */
.pl .pick{background:none;box-shadow:none;width:56px;height:56px}
.pl .pick .av{width:54px;height:54px}
/* v25 summary chips with animated svgs */
.sumrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;color:var(--ink)}
.chip2{display:inline-flex;align-items:center;gap:6px;padding:7px 13px 7px 10px;border-radius:var(--pill);background:rgba(255,255,255,.78);border:1px solid rgba(17,17,20,.08);box-shadow:0 6px 14px -10px rgba(17,17,20,.35);font-size:13px;font-weight:600;color:var(--grey);white-space:nowrap}
.chip2 b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.chip2 .ic{width:18px;height:18px;color:var(--ink);stroke-width:2}
.chip2 .u2{transform-box:fill-box;transform-origin:50% 100%;animation:u2 2.6s ease-in-out infinite}
@keyframes u2{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px) rotate(5deg)}}
.chip2 .eye{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center;animation:blink 4.5s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.chip2 .hand,.chip2 .hand2{transform-origin:12px 12px;animation:spin 6s linear infinite}
.chip2 .hand2{animation-duration:72s}
.chip2.nt .hand,.chip2.nt .hand2{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes nudge{0%,65%,100%{transform:translateX(0)}82%{transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){.chip2 *,.dock .btn.go .ic{animation:none!important}}
/* v26 chips without background */
.chip2{background:none;border:0;box-shadow:none;padding:4px 6px}
/* v28 categories: ? pattern only on selected cards */
.sheet:has(.cats){background:linear-gradient(180deg,#fff 0,#F7F7FA 100%)}
.cats .cat::before{opacity:0;transition:opacity .35s}
.cats .cat[aria-pressed="true"]::before{opacity:.17}
/* v29 player photos */
.pl .pw{position:relative;flex:none;width:56px;height:56px}
.pl .pw .pick{width:56px;height:56px}
.pl .cam,.pl .camx{position:absolute;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 4px 8px -2px rgba(17,17,20,.5)}
.pl .cam{right:-6px;bottom:-4px;background:var(--ink);color:#fff}
.pl .camx{left:-6px;top:-4px;background:var(--red);color:#fff}
.pl .cam .ic{width:15px;height:15px}.pl .camx .ic{width:13px;height:13px;stroke-width:2.6}
.pl .cam::before,.pl .camx::before{content:"";position:absolute;inset:-9px}
/* v30 file inputs sit directly under the finger */
.pl .fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer;z-index:2}
.pl .cam .fi{inset:0 -9px -9px 0;width:calc(100% + 9px);height:calc(100% + 9px)}
.pl .cam::before{display:none}
.pl .pick.lbl{position:relative;display:grid;place-items:center;cursor:pointer}
/* v31 anti-flicker: no backdrop blur, calm background while a sheet is open */
*,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.scrim{background:rgba(17,17,20,.55)}
.sheet-open .hero2 *,.sheet-open .page2 *,.sheet-open .dock *{animation-play-state:paused!important}
.scrim.still .cats .cat,.scrim.still .sheet>*{animation:none!important}

/* v32 mobile stability
   Root cause of the mobile flicker: ~55 CSS animations on SVG children (the blurred / transform-box ones cannot be
   composited) plus ~60 SMIL <animate> nodes kept the main thread repainting the full-screen fixed background at
   60fps, even while idle. Every DOM swap then landed in an already saturated frame. Desktop GPUs hide this.
   Touch devices now get a calm, static version of those layers. Kept: everything compositor-only (drifting
   gradient blobs, floating ?, button sheen). Open the page with ?fx=1 to force the full effects for comparison. */
@media (hover:none) and (pointer:coarse){
  html:not(.fx) .bgart svg *{animation:none!important}
  html:not(.fx) .hero2>svg *{animation:none!important}
  html:not(.fx) .hero2::after{animation:none!important}
  html:not(.fx) .cats .cat[aria-pressed="true"]::before{animation:none!important}
}
/* sheets: never let a drag inside the sheet scroll the page behind it (that collapses the browser bars, changes
   100dvh and re-lays-out everything under the scrim) */
.sheet{overscroll-behavior:contain}
.scrim{overscroll-behavior:contain}
html.sheet-open{overflow:hidden}
/* v33 main page: no flash on tap / hover.
   Scoped to the home screen only (body.home #app); cards, sheets and game screens are untouched.
   - the tap highlight is switched off on every element, not just <html>
   - no idle sheen sweep on the start button
   - press feedback is a quick scale only
   - on touch devices the slow background drift is paused behind the home screen */
*{-webkit-tap-highlight-color:transparent}
body.home #app .btn.go::after{animation:none!important}
body.home #app .btn:active,body.home #app .sum:active,body.home #app .hbtn:active{transition-duration:.08s;transition-timing-function:ease-out}
@media (hover:none) and (pointer:coarse){
  body.home .bgart::before,body.home .bgart::after{animation:none;will-change:auto}
  body.home #app .hero2::after{mix-blend-mode:normal;opacity:.5}
}
</style>

/* make live element `a` match freshly rendered `b`, touching only what changed.
   Elements survive (focus, keyboard, caret, scroll, transitions, running animations) instead of being re-created. */
function morph(a,b){
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if(a instanceof HTMLInputElement&&a.type!=="file"&&a!==document.activeElement){const v=b.getAttribute("value")||"";if(a.value!==v)a.value=v}
  const ca=a.childNodes,cb=b.childNodes;
  for(let i=0;i<cb.length;i++){
    const x=ca[i],y=cb[i];
    if(!x){a.appendChild(document.importNode(y,true));continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(document.importNode(y,true),x);continue}
    if(x.nodeType===1)morph(x,y);else if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;
  }
  while(a.childNodes.length>cb.length)a.removeChild(a.lastChild);
}

function start(){
  const pool=[];
  S.cats.forEach(c=>W[c].forEach(w=>pool.push([w,c])));
  (S.cu?S.custom:"").split(",").map(s=>s.trim()).filter(Boolean).forEach(w=>pool.push([w,"Personalizat"]));
  if(!pool.length){S.sheet="cats";drawSheet();vib([40,40]);beep(200,.15,"square");setTimeout(()=>{const n=document.getElementById("cn");if(n){n.classList.remove("nudge");void n.offsetWidth;n.classList.add("nudge")}},80);return}
  const [word,cat]=pool[Math.random()*pool.length|0],n=S.players.length;
  let ok=[...Array(n).keys()].filter(i=>!S.last.includes(i));
  if(ok.length<S.k)ok=[...Array(n).keys()];
  const intr=[];
  while(intr.length<S.k){const i=ok[Math.random()*ok.length|0];if(!intr.includes(i))intr.push(i)}
  const troll=S.troll&&n>=4&&Math.random()<.2;
  if(troll){intr.length=0;for(let i=0;i<n;i++)intr.push(i)}
  S.last=troll?[]:intr;S.players.forEach((_,i)=>{S.scores[i]=S.scores[i]||0});
  G={word,cat,intr,troll,first:Math.random()*n|0,votes:[],hint:""};
  if(S.hint){
    const rel=W[cat]?W[cat].filter(x=>x!==word):[];
    const hs=[`Prima literă: ${word[0].toUpperCase()}`];
    if(W[cat]){hs.push(`Categoria: ${cat}`);hs.push(`Înrudit cu: ${rel[Math.random()*rel.length|0]}`)}

  }
  pass(0);
}

    ${S.tm?`<div class="ringbox"><svg class="r" viewBox="0 0 208 208" aria-hidden="true"><circle cx="104" cy="104" r="88" fill="none" stroke="#F4F4F6" stroke-width="12"/><circle id="rg" cx="104" cy="104" r="88" fill="none" stroke="#111114" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><p class="timer" id="tm" role="timer">${fmt(t)}</p></div>`:""}
    <div class="grow"></div>
    <footer class="dock"><button class="btn go" data-a="vote" data-v="0">Trecem la vot</button><button class="link" data-a="reveal">Dezvăluie direct</button></footer></section>`);
  const E=Date.now()+total*1000;if(S.tm)tick=setInterval(()=>{const p=t;t=Math.ceil((E-Date.now())/1000);if(t<p&&t<=10&&t>0){beep(700,.05);vib(10)}const e=document.getElementById("tm"),r=document.getElementById("rg");
    if(e){e.textContent=fmt(Math.max(t,0));e.classList.toggle("low",t<=10)}
    if(r)r.setAttribute("stroke-dashoffset",String(C*(1-Math.max(0,E-Date.now())/(total*1000))));{const b=document.querySelector(".ringbox");if(b&&t<p){b.classList.remove("ping");void b.offsetWidth;b.classList.add("ping")}}
    if(t<=0){clearInterval(tick);beep(300,.6);vib([200,100,200])}},250);
}

function vote(i){
  clearInterval(tick);
  if(i>=S.players.length){tally();return}
  G.pk=null;
  view(`<section class="screen">${topbar(i,S.players.length,"Votul")}
    <div class="who">${av(S.players[i],56)}<div><h1 class="h1">${esc(pn(i))}</h1><p class="muted">Cine e intrusul? Votul e secret.</p></div></div>
    <div class="vgrid">${S.players.map((p,j)=>j===i?"":`<button class="suspect" data-a="pick" data-v="${j}" aria-pressed="false"><span class="lens">${ic("search")}</span>${av(p,56)}${esc(pn(j))}</button>`).join("")}</div>
    <footer class="dock"><button class="btn go" id="ok" disabled data-a="confirm" data-v="${i}">Confirmă votul</button></footer></section>`);
}

function tally(){
  const c={};G.votes.forEach(v=>{c[v]=(c[v]||0)+1});
  const mx=Math.max(...Object.values(c));
  G.top=Object.keys(c).filter(k=>c[k]==mx).map(Number);
  view(`<section class="screen"><header><h1 class="h1">Voturile</h1><p class="muted">Cel mai votat e suspectul principal.</p></header>
    <ul>${S.players.map((p,j)=>`<li class="score${G.top.includes(j)?" top":""}">${av(p,48)}<span class="name">${esc(pn(j))}</span><span class="tot">${c[j]||0}</span></li>`).join("")}</ul>
    <footer class="dock"><button class="btn go" data-a="reveal">Dezvăluie intrusul</button></footer></section>`);
  beep(440,.2);vib(60);countUp();
}

function reveal(){setTimeout(impact,330);
  clearInterval(tick);
  if(G.troll){
    view(`<section class="screen center"><header class="bar"><button class="round" data-a="quit" aria-label="Ieși din rundă">${ic("x")}</button><span class="sp"></span></header>
    <div class="grow"></div><span class="stamp red">SURPRIZĂ</span>
    <div><h1 class="h1">Toți ați fost intruși.</h1><p class="muted">Nimeni nu a știut cuvântul. Nu se acordă puncte.</p></div>
    <div class="stage">${CONE}${S.players.map(p=>`<div>${av(p,48)}</div>`).join("")}</div>
    <div><p class="muted">Cuvântul era</p><p class="wordtag">${esc(G.word)}</p></div>
    <div class="grow"></div>
    <footer class="dock"><button class="btn go" data-a="end" data-v="-1">Continuă</button></footer></section>`);
    beep(110,.3,"square");vib([80,60,80]);return;
  }
  const caught=G.top&&G.top.length===1&&G.intr.includes(G.top[0]);
  const rec=G.top?(caught?0:2):-1;
  const O=[["Prins","+1 ceilalți"],["Prins, dar a ghicit cuvântul","+1 intrus"],["A scăpat","+2 intrus"]];
  view(`<section class="screen center"><header class="bar"><button class="round" data-a="quit" aria-label="Ieși din rundă">${ic("x")}</button><span class="sp"></span></header>
    <div><p class="muted">${G.intr.length>1?"Intrușii erau":"Intrusul era"}</p>
    <div class="stage">${CONE}${G.intr.map(i=>`<div>${av(S.players[i],96)}<p class="h2">${esc(pn(i))}</p></div>`).join("")}</div>
    <span class="stamp red">INTRUS</span></div>
    <div><p class="muted">Cuvântul era</p><p class="wordtag">${esc(G.word)}</p></div>
    ${G.top?`<p class="verdict">${caught?"Votul l-a prins.":"Votul a greșit."}</p>`:""}
    <div class="grow"></div>
    <footer class="dock"><p class="h2">Cum s-a terminat runda?</p>
      ${O.map(([l,p],k)=>`<button class="outcome${k===rec?" rec":""}" data-a="end" data-v="${k}"><span>${l}</span><span class="pts">${p}</span></button>`).join("")}</footer></section>`);
  beep(110,.3,"square");vib([80,60,80]);
}

function end(o){
  const d={};
  S.players.forEach((_,i)=>{const I=G.intr.includes(i);d[i]=(o==0&&!I)?1:(o==1&&I)?1:(o==2&&I)?2:0;S.scores[i]+=d[i]});
  const r=S.players.map((_,i)=>i).sort((a,b)=>S.scores[b]-S.scores[a]);
  view(`<section class="screen center"><header>${TROPHY}<h1 class="h1">Clasament</h1></header>
    <ul class="full">${r.map((i,k)=>`<li class="score${k==0?" top":""}"><span class="rank">${k==0?ic("crown"):k+1}</span>${av(S.players[i],48)}<span class="name">${esc(pn(i))}${d[i]?` <span class="muted">+${d[i]}</span>`:""}</span><span class="tot">${S.scores[i]}</span></li>`).join("")}</ul>
    <div class="grow"></div>
    <footer class="dock"><button class="btn go" data-a="start">Runda următoare</button><button class="link" data-a="reset">Joc nou</button></footer></section>`);beep(660,.12);setTimeout(()=>beep(880,.2),120);countUp();setTimeout(confetti,450);
}

const onHome=el=>document.body.classList.contains("home")&&!!el.closest("#app");
const shine=el=>{if(onHome(el))return;el.classList.remove("shine");void el.offsetWidth;el.classList.add("shine")};
const impact=()=>{if(RM())return;const a=document.getElementById("app");a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");vib(40)};
const countUp=()=>document.querySelectorAll(".tot").forEach((el,i)=>{const n=+el.textContent;if(!n||RM())return;const t0=performance.now()+300+i*70;el.textContent="0";
  const f=t=>{const k=Math.min(1,Math.max(0,(t-t0)/700));el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);else popEl(el)};requestAnimationFrame(f)});
const confetti=(n=40)=>{if(RM())return;const cols=["#111114","#D8002B","#5C5C66","#D9D9DF"];
  for(let i=0;i<n;i++){const c=document.createElement("i"),a=(Math.random()-.5)*Math.PI*.9-Math.PI/2,v=240+Math.random()*300;c.className="cf";
    c.style.cssText=`left:50%;top:36%;background:${cols[i%4]};border-radius:${i%3?"2px":"50%"};--dx:${Math.cos(a)*v|0}px;--dy:${Math.sin(a)*v|0}px;--r:${Math.random()*720-360|0}deg;--s:${(.7+Math.random()*.8).toFixed(2)};animation-delay:${i*8}ms`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}vib([30,40,30])};
const tap=()=>{if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type="triangle";o.frequency.setValueAtTime(240,n);o.frequency.exponentialRampToValueAtTime(140,n+.04);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.0001,n+.05);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+.06)}catch(e){}};
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.outcome,.sum,.hbtn,.round,.addrow,.chip,.seg button,.link,.pillbtn,.cat,.suspect,.pick,.switch");if(!b||b.disabled)return;tap();vib(6);if(b.classList.contains("go"))shine(b)});
const A={
  unphoto(v){delete S.players[Number(v)].ph;drawSheet();refresh();beep(380,.05);vib(10)},
  av(v){const u=S.players.map(p=>p.a);let j=S.players[v].a;do{j=(j+1)%12}while(u.includes(j));S.players[v].a=j;drawSheet();refresh();const pa=document.querySelectorAll("#sr .pick .av")[v];if(pa)popEl(pa);beep(600,.05);vib(10)},
  add(){const u=S.players.map(p=>p.a);S.players.push({n:"",a:[...Array(12).keys()].find(x=>!u.includes(x))});drawSheet();refresh();const rw=document.querySelectorAll("#sr .panel .cr");if(rw.length)rw[rw.length-1].classList.add("in");beep(620,.06);vib(12)},
  rm(v,e){const row=e&&e.target.closest(".cr");if(row&&!RM()){if(row.classList.contains("out"))return;row.classList.add("out");beep(380,.05);vib(10);setTimeout(()=>A.rm(v),190);return}v=+v;{const ae=document.activeElement;if(ae&&ae.matches&&ae.matches(".pl .field"))ae.blur()}S.players.splice(v,1);const q={};Object.keys(S.scores).forEach(k=>{k=+k;if(k<v)q[k]=S.scores[k];else if(k>v)q[k-1]=S.scores[k]});S.scores=q;S.last=[];const mx=Math.max(1,(S.players.length-1)>>1);if(S.k>mx)S.k=mx;drawSheet();refresh()},
  k(v){const mx=Math.max(1,Math.floor((S.players.length-1)/2));S.k=Math.min(mx,Math.max(1,S.k+Number(v)));
    const e=document.getElementById("kv");e.textContent=S.k;bump(e);updLu();
    document.getElementById("km").disabled=S.k<=1;document.getElementById("kp").disabled=S.k>=mx;
    beep(520,.05);vib(10);refresh()},
  hint(v,e){S.hint=!S.hint;e.target.closest("[data-a]").setAttribute("aria-checked",String(S.hint));beep(S.hint?660:420,.05);vib(10);save()},
  tm(v,e){S.tm=Number(v);{const sg=e.target.closest(".seg"),t=document.getElementById("tv");if(sg)sg.style.setProperty("--i",[2,3,5,0].indexOf(S.tm));if(t){t.innerHTML=tmv();bump(t)}}document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
    popEl(e.target.closest("[data-a]"));beep(560,.05);vib(10);refresh()},
  sheet(v){S.sheet=v;drawSheet()},
  yes(){const f=P.f;S.sheet=null;drawSheet();f()},
  opt(v,e){S[v]=!S[v];e.target.closest("[data-a]").setAttribute("aria-checked",String(S[v]));beep(560,.05);vib(10);save()},
  troll(v,e){S.troll=!S.troll;e.target.closest("[data-a]").setAttribute("aria-checked",String(S.troll));beep(S.troll?700:420,.06);vib(15);save()},
  cu(v,e){const b=e.target.closest("[data-a]"),w=document.getElementById("cw");S.cu=!S.cu;b.setAttribute("aria-pressed",String(S.cu));popEl(b);w.hidden=!S.cu;
    if(S.cu){burst(b);beep(660,.06);w.querySelector("input").focus()}else beep(400,.05);vib(15);updCats();save()},
  done(){S.sheet=null;drawSheet()},
  close(v,e){if(e.target.classList.contains("scrim")){S.sheet=null;drawSheet()}},
  cat(v,e){const b=e.target.closest("[data-a]"),on=!S.cats.includes(v);S.cats=on?[...S.cats,v]:S.cats.filter(x=>x!==v);
    b.setAttribute("aria-pressed",String(on));popEl(b);if(on){burst(b);beep(660,.06)}else beep(400,.05);vib(on?20:10);updCats();save()},
  allcats(){const all=S.cats.length===Object.keys(W).length;S.cats=all?[]:Object.keys(W);
    document.querySelectorAll("#sr .cat[data-a=cat]").forEach((b,i)=>setTimeout(()=>{b.setAttribute("aria-pressed",String(!all));popEl(b);if(!all){burst(b);beep(520+i*70,.05)}},i*55));
    if(all)beep(360,.08);vib(all?10:[12,30,12]);refresh()},
  quit(){ask("Ieși din rundă?","Scorurile se păstrează.","Ieși",()=>{clearInterval(tick);setup()})},
  start,reveal,
  next(v){pass(Number(v))},
  vote(v){vote(Number(v))},
  pick(v,e){G.pk=Number(v);burst(e.target.closest("[data-a]"));document.querySelectorAll(".suspect").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));{const o=document.getElementById("ok");if(o.disabled)popEl(o);o.disabled=false}beep(660,.06);vib(15)},
  confirm(v){G.votes.push(G.pk);vote(Number(v)+1)},
  end(v){end(Number(v))},
  reset(){ask("Joc nou?","Scorurile se șterg.","Începe",()=>{S.scores={};S.last=[];setup()})}
};
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.outcome,.sum,.hbtn,.round,.addrow,.chip,.seg button,.link,.pillbtn");if(!b||b.disabled||onHome(b))return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,i=document.createElement("i");i.className="rip";i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(i);setTimeout(()=>i.remove(),600)});
document.addEventListener("change",e=>{const t=e.target;if(!t||t.type!=="file"||t.dataset.p===undefined)return;const PV=Number(t.dataset.p),f=t.files&&t.files[0];if(!f||!S.players[PV])return;
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{try{const side=Math.min(im.width,im.height),sx=(im.width-side)/2,sy=(im.height-side)*.3,c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,sx,sy,side,side,0,0,160,160);S.players[PV].ph=c.toDataURL("image/jpeg",.82);drawSheet();refresh();const pa=document.querySelectorAll("#sr .pick .av")[PV];if(pa)popEl(pa);beep(700,.07);vib(15)}catch(x){}};im.src=rd.result};rd.readAsDataURL(f)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,e)});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&S.sheet){S.sheet=null;drawSheet()}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.i!==undefined)S.players[Number(t.dataset.i)].n=t.value;
  if(t.dataset.f==="custom")S.custom=t.value;
  refresh();
});
setup();
</script>
<script>document.getElementById("bgtest").addEventListener("click",function(){var on=document.body.classList.toggle("bgonly");this.setAttribute("aria-pressed",String(on))});</script>
</body>
